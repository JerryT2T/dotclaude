<!doctype html><meta charset="utf-8"><title>padded-tiled</title>
<style>body{margin:0;background:#111;color:#ccc;font:12px sans-serif}
.feedback-fab{position:fixed;right:18px;bottom:18px;width:44px;height:44px;border-radius:50%;background:#444}
.panel-fab{position:fixed;right:18px;top:18px;width:44px;height:44px;border-radius:50%;background:#444}
.toc-rail{position:fixed;right:20px;top:110px;bottom:110px;width:120px;display:flex;flex-direction:column;padding:12px 0}
.toc-rail p{flex:1 1 0;margin:0;cursor:pointer;display:flex;align-items:center;justify-content:flex-end}
.toc-rail p i{width:5px;height:5px;border-radius:50%;background:#79c0ff;margin-right:8px}</style>
<div class="panel-fab"></div><div class="feedback-fab"></div>
<section data-iteration="1" data-active><div class="toc-rail" id="r"></div></section>
<script>for(let i=0;i<58;i++){const p=document.createElement("p");p.innerHTML="<i></i>";r.appendChild(p)}</script>
